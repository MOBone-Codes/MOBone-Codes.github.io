<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <!--[if IE]><meta http-equiv="x-ua-compatible" content="IE=9" /><![endif]-->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOBone - Google Reviews</title>
  <meta name="description" content="Read MOBone Google reviews and write your own review.">
  <link rel="shortcut icon" href="images/mobone/fav_icon.png">
  <link rel="stylesheet" type="text/css" href="css/vendor/bootstrap.min.css" />
  <link rel="stylesheet" type="text/css" href="css/vendor/font-awesome.min.css">
  <link rel="stylesheet" type="text/css" href="css/vendor/owl.carousel.min.css">
  <link rel="stylesheet" type="text/css" href="css/vendor/owl.theme.default.min.css">
  <link rel="stylesheet" type="text/css" href="css/vendor/magnific-popup.css">
  <link rel="stylesheet" type="text/css" href="css/vendor/animate.min.css">
  <link rel="stylesheet" type="text/css" href="css/vendor/font-awesome-animation.min.css">
  <link rel="stylesheet" type="text/css" href="css/style.css" />
  <script src="js/vendor/modernizr.min.js"></script>
  <script disable-devtool-auto src="https://cdn.jsdelivr.net/npm/disable-devtool@latest/disable-devtool.min.js"></script>
  <script type="text/javascript" src="//wurfl.io/wurfl.js"></script>
</head>

<body>
  <div id="loading"></div>
  <div data-include="header"></div>

  <div class="section bgi-cover-center">
    <div class="content-wrap">
      <div class="container">
        <div class="row mb-4">
          <div class="col-12 text-center">
            <h2 class="section-heading text-primary mb-2">Google Reviews</h2>
            <p class="subheading mb-4">Read what customers say about MOBone on Google.</p>
            <a id="write-review-btn" class="btn btn-primary" href="#" target="_blank" rel="noopener noreferrer">
              Post on Google Reviews
            </a>
            <p id="write-review-note" class="mt-3 mb-0 text-muted">
              Use this button to open the official Google review form.
            </p>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-12 text-center">
            <div id="google-reviews-summary" class="p-3" style="border: 1px solid #eee; border-radius: 10px; display: none;"></div>
          </div>
        </div>

        <div id="google-reviews-status" class="text-center text-muted mb-3">Loading Google reviews...</div>
        <div id="google-reviews-list" class="row"></div>
      </div>
    </div>
  </div>

  <div id="google-place-helper-map" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;"></div>
  <div data-include="footer"></div>

  <script src="js/vendor/jquery.min.js"></script>
  <script src="js/vendor/popper.min.js"></script>
  <script src="js/vendor/bootstrap.min.js"></script>
  <script src="js/vendor/owl.carousel.js"></script>
  <script src="js/vendor/jquery.magnific-popup.min.js"></script>
  <script src="js/script.js"></script>
  <script src="js/google-reviews.js"></script>
</body>

</html>
